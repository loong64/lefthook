# Update all mentions of this name in vercel-packages when changing.
name: deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'github tag'
        required: false
        default: ''
  schedule:
    - cron: '0 12 * * *'

jobs:
  check:
    runs-on: ubuntu-slim
    steps:
      - name: Check Version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version=$(curl --retry 10 -s https://api.github.com/repos/evilmartians/lefthook/releases/latest | jq -r ".tag_name")
          fi
          echo "Current Version: ${version}"
          if [ -z "${version}" ] || [ "${version}" == "null" ]; then
            echo "Failed to get version"
            exit 1
          fi
          echo "version=${version}" >> $GITHUB_ENV
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Check Update
        id: check_update
        run: |
          wget -qO /tmp/LICENSE https://github.com/${{ github.repository }}/raw/refs/heads/loong64-${version}/LICENSE || update=yes
          echo "update=${update:-no}" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        if: ${{ steps.check_update.outputs.update == 'yes' }}
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set Repository
        if: ${{ steps.check_update.outputs.update == 'yes' }}
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git remote add upstream https://github.com/evilmartians/lefthook.git

      - name: Push Repository
        if: ${{ steps.check_update.outputs.update == 'yes' }}
        run: |
          git fetch upstream --prune --force
          git checkout ${version} -b loong64-${version}
          wget -qO - https://github.com/${{ github.repository }}/raw/refs/heads/master/patch_loong64.patch | patch -p1
          cp -pR packaging/registries/npm/lefthook-linux-arm64 packaging/registries/npm/lefthook-linux-loong64
          sed -i 's/arm64/loong64/g' packaging/registries/npm/lefthook-linux-loong64/package.json
          sed -i 's/ARM/LoongArch/g' packaging/registries/npm/lefthook-linux-loong64/package.json
          LEFTHOOK_VERSION=$(jq -r '.optionalDependencies["lefthook-linux-arm64"]' packaging/registries/npm/lefthook/package.json)
          sed -i "/\"lefthook-linux-arm64\":/a\\    \"@lefthook-linux-loong64\": \"${LEFTHOOK_VERSION}\"," packaging/registries/npm/lefthook/package.json
          git add .
          git commit -m "feat: add loongarch64 platform support"
          git push origin loong64-${version} --force

      - name: Push Tag
        if: ${{ steps.check_update.outputs.update == 'yes' }}
        run: |
          sleep 5s
          git tag -d ${version} || true
          git tag ${version}
          git push origin -f ${version}