version: 2
project_name: lefthook
before:
  hooks:
    - go generate ./...
builds:
  # Builds the binaries without `lefthook upgrade`
  - id: no_self_update
    tags:
      - no_self_update
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
      - loong64
      - 386
    ignore:
      - goos: darwin
        goarch: 386
      - goos: linux
        goarch: 386
      - goos: freebsd
        goarch: 386
      - goos: openbsd
        goarch: 386
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/evilmartians/lefthook/v2/internal/version.commit={{.Commit}}

  # Full lefthook binary
  - id: lefthook
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
      - loong64
      - 386
    ignore:
      - goos: darwin
        goarch: 386
      - goos: linux
        goarch: 386
      - goos: freebsd
        goarch: 386
      - goos: openbsd
        goarch: 386
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/evilmartians/lefthook/internal/version.commit={{.Commit}}

  - id: lefthook-linux-aarch64
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/evilmartians/lefthook/internal/version.commit={{.Commit}}

  - id: lefthook-linux-loongarch64
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - loong64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/evilmartians/lefthook/internal/version.commit={{.Commit}}

archives:
  - id: lefthook
    formats: [binary]
    ids:
      - lefthook
    files:
      - none*
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}MacOS
      {{- else }}{{ title .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

  - id: lefthook-gz
    formats: [gz]
    ids:
      - lefthook
    files:
    - none*
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}MacOS
      {{- else }}{{ title .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

  - id: lefthook-linux-aarch64
    formats: [binary]
    ids:
      - lefthook-linux-aarch64
    files:
      - none*
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}MacOS
      {{- else }}{{ title .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}

  - id: lefthook-linux-aarch64-gz
    formats: [gz]
    ids:
      - lefthook-linux-aarch64
    files:
      - none*
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}MacOS
      {{- else }}{{ title .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}

  - id: lefthook-linux-loongarch64
    formats: [binary]
    ids:
      - lefthook-linux-loongarch64
    files:
      - none*
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}MacOS
      {{- else }}{{ title .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "loong64" }}loongarch64
      {{- else }}{{ .Arch }}{{ end }}

  - id: lefthook-linux-loongarch64-gz
    formats: [gz]
    ids:
      - lefthook-linux-loongarch64
    files:
      - none*
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}MacOS
      {{- else }}{{ title .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "loong64" }}loongarch64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
    - '^spec:'
    - '^tmp:'
    - '^context:'
    - '^\d+\.\d+\.\d+:'
